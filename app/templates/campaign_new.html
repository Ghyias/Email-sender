{% extends "base.html" %}
{% block title %}New campaign — MailPilot{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-4">New campaign</h1>
<form method="post" action="/campaigns/create" class="space-y-3 max-w-lg text-sm">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <label class="block">Name<input name="name" required class="w-full border rounded px-2 py-1" /></label>
  <label class="block">Template
    <select name="template_id" class="w-full border rounded px-2 py-1" required>
      {% for t in tpls %}<option value="{{ t.id }}">{{ t.name }}</option>{% endfor %}
    </select>
  </label>
  <label class="block">Owner filter (auto-select that sender’s accounts)
    <input name="owner_key" class="w-full border rounded px-2 py-1" placeholder="usama or faizan — leave blank for all" />
  </label>
  <label class="block">Sending account IDs (optional override)
    <input name="account_ids" class="w-full border rounded px-2 py-1" placeholder="leave blank to auto-pick by owner / all active" />
  </label>
  <p class="text-xs text-slate-500">Available: {% for a in accounts %}{{ a.id }}={{ a.email }}{% if a.owner_key %} [{{ a.owner_key }}]{% endif %} {% endfor %}</p>
  <label class="block">Contact group
    <select name="group" class="w-full border rounded px-2 py-1">
      <option value="">All eligible</option>
      {% for g in groups %}<option value="{{ g }}">{{ g }}</option>{% endfor %}
    </select>
  </label>
  <label class="block">Follow-up days (optional)<input name="followup_days" class="w-full border rounded px-2 py-1" /></label>
  <label class="block">Send mode
    <select name="send_mode" class="w-full border rounded px-2 py-1">
      <option value="now">Send now (spread out)</option>
      <option value="at">Specific datetime</option>
      <option value="recipient_local">Recipient local window</option>
    </select>
  </label>
  <div class="grid grid-cols-2 gap-2">
    <label>Window start<input name="window_start" value="09:00" class="w-full border rounded px-2 py-1" /></label>
    <label>Window end<input name="window_end" value="11:30" class="w-full border rounded px-2 py-1" /></label>
  </div>
  <button class="bg-slate-900 text-white rounded px-4 py-2">Create</button>
</form>
{% endblock %}
