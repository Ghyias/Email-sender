{% for a in accounts %}
{% set st = statuses.get(a.id, {}) %}
<div class="text-xs text-slate-500 mb-1">
  {{ a.email }}:
  {% if st.state == 'running' %}
  syncing {{ st.progress or 0 }}/{{ st.total or '?' }}
  {% elif st.state == 'error' %}
  <span class="text-rose-600">error: {{ st.error }}</span>
  {% else %}
  idle
  {% endif %}
</div>
{% endfor %}
